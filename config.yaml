narrative:
  theme: "AI Inference Boom"

technical:
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  ma_fast: 50
  ma_slow: 200

backtest:
  default_start: "2023-01-01"
  default_period_years: 2

forecast:
  enabled: true
  smoothing_alpha: 0.35   # Exponential smoothing factor (0-1)
  horizon_days: 2         # Forecast horizon for phase prediction

tickers:
  NVDA:
    name: NVIDIA
    color: "🟢"
    note: "Strongest winner - inference boom"
    narrative_fit: strong
  TSM:
    name: TSMC
    color: "🟢"
    note: "Quiet chip enabler"
    narrative_fit: strong
  CBRS:
    name: Cerebras
    color: "🟢"
    note: "Pure specialized inference play (volatile)"
    narrative_fit: strong
  CRDO:
    name: Credo
    color: "🟡"
    note: "Viral AI connectivity play"
    narrative_fit: monitor
  MU:
    name: Micron
    color: "🟡"
    note: "HBM memory - inference critical"
    narrative_fit: monitor

export:
  directory: exports

alerts:
  email: false
  telegram: false

telegram:
  enabled: false
  bot_token: ""  # Create bot via BotFather, get token
  chat_id: ""   # Your chat ID or channel @username

dashboard:
  enabled: true
  port: 8501
  refresh_interval: 60  # seconds for auto-refresh (0 to disable)

twitter:
  enabled: true
  bearer_token: ""  # Set your X API v2 bearer token here or in .env
  search_limit: 50
  lookback_hours: 24

sentiment:
  model: "ProsusAI/finbert"
  enabled: true
  fallback_to_vader: true
