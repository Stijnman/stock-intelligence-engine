narrative:
  theme: "AI Inference Boom"

technical:
  rsi_period: 14
  rsi_overbought: 70
  rsi_oversold: 30
  ma_fast: 50
  ma_slow: 200

backtest:
  default_start: "2023-01-01"
  default_period_years: 2

forecast:
  enabled: true
  smoothing_alpha: 0.35   # Exponential smoothing factor (0-1)
  horizon_days: 2         # Forecast horizon for phase prediction

insider:
  enabled: true
  lookback_days: 14        # Window for Form 4 / insider clustering
  min_cluster_size: 2      # Minimum filings to consider a cluster
  buy_boost_min: 2         # Buy filings required for +1 signal boost
  sell_penalty_min: 2      # Sell filings required for -1 signal penalty

prediction_markets:
  enabled: true
  min_volume: 1000         # Minimum market volume to consider
  boost_prob_threshold: 0.65   # Probability above which weak signals get boosted
  penalty_prob_threshold: 0.35 # Probability below which strong signals get penalized
  divergence_boost: 1      # Magnitude of soft boost/penalty on divergence

institutional:
  enabled: true
  min_holders: 3                 # Minimum reported institutional holders to consider
  significant_pct_change: 0.5    # Minimum % change treated as material
  boost_pct_threshold: 1.0       # % increase required for +1 signal boost
  penalty_pct_threshold: -1.0    # % decrease required for -1 signal penalty

congressional:
  enabled: true
  lookback_days: 90              # Window for congressional trade clustering
  min_trades: 2                  # Minimum trades to consider a cluster
  buy_boost_min: 2               # Buy trades required for +1 signal boost
  sell_penalty_min: 2            # Sell trades required for -1 signal penalty
  min_trade_value: 15000         # Minimum approximate trade value to count

portfolio:
  enabled: true
  lookback_period: "1y"          # yfinance period for correlation / risk calc
  min_periods: 30                # Minimum overlapping return observations
  risk_free_rate: 0.04           # Annual risk-free rate for Sharpe

dark_pool:
  enabled: true
  elevated_ratio: 1.8            # ATS/ADV ratio treated as elevated (observation)
  boost_ratio: 2.2               # Ratio required for +1 accumulation boost
  penalty_ratio: 2.0             # Ratio required for -1 distribution penalty (when side inferred)
  min_confidence: 0.45           # Gate weak signals below this confidence

realtime:
  enabled: true

options_iv:
  enabled: true
  elevated_skew: 0.12            # Mild put skew observation threshold
  boost_skew: 0.22               # Moderate elevated skew
  penalty_skew: 0.28             # High fear/hedging skew → caution/penalty
  min_confidence: 0.40           # Gate weak signals below this confidence
  term_slope_threshold: 0.05     # Absolute slope treated as meaningful contango/inversion

options_0dte:
  enabled: true
  min_volume_spike: 2.5
  min_oi_ratio: 1.8
  boost_threshold: 0.6
  penalty_threshold: 0.55
  min_confidence: 0.40

edgar:
  enabled: true
  lookback_hours: 36
  min_materiality: 0.55
  boost_on_positive: true
  penalty_on_negative: true
  min_confidence: 0.40

hiring:
  enabled: true
  boost_growth_pct: 8.0          # % open-role / headcount growth required for +1 boost
  penalty_growth_pct: -5.0       # % contraction required for -1 penalty
  min_confidence: 0.40           # Gate weak signals below this confidence

supply_chain:
  enabled: true
  try_yfinance: true
  boost_score: 0.55
  penalty_score: -0.45
  min_confidence: 0.40
  suppliers:
    - ASML
    - AMAT
    - LRCX
    - KLAC
    - TSM

short_interest:
  enabled: true
  elevated_ratio: 0.48
  covering_change: -0.08
  expanding_change: 0.08
  narrative_hot: 1.5
  min_confidence: 0.40

attention:
  enabled: true
  try_wikimedia: true
  boost_momentum: 0.25
  penalty_momentum: -0.20
  min_confidence: 0.40

authenticity:
  enabled: true
  high_auth_threshold: 0.62      # Score above which velocity is treated as high-authenticity
  low_auth_threshold: 0.38       # Score below which elevated velocity is treated as bot/spam risk
  narrative_hot: 1.5             # Filtered velocity level treated as hot
  min_confidence: 0.40           # Gate weak signals below this confidence

consumer_spend:
  enabled: true
  boost_momentum: 0.18          # Panel spend momentum required for +1 soft boost
  penalty_momentum: -0.15        # Contraction threshold for -1 soft penalty
  min_confidence: 0.40           # Gate weak signals below this confidence

securities_lending:
  enabled: true
  elevated_borrow_fee: 5.0       # Annualized % fee treated as elevated
  high_borrow_fee: 15.0          # Annualized % fee treated as high / squeeze-risk
  elevated_days_to_cover: 4.0
  narrative_hot: 1.5
  min_confidence: 0.40

thesis:
  enabled: true
  min_evidence: 3                # Minimum evidence items for higher confidence
  max_points_per_side: 4         # Cap bullet points in each thesis paragraph

brief:
  enabled: true

honesty:
  enabled: true
  high_risk_threshold: 0.55
  mid_risk_threshold: 0.35
  min_confidence: 0.40

confidence:
  enabled: true
  min_confidence: 0.15
  max_confidence: 0.95
  high_threshold: 0.70
  mid_threshold: 0.45

regime:
  enabled: true
  # VIX thresholds are hard-coded in sie/regime.py for stability;
  # weights are applied as soft multipliers on overlay groups.

tickers:
  NVDA:
    name: NVIDIA
    color: "🟢"
    note: "Strongest winner - inference boom"
    narrative_fit: strong
  TSM:
    name: TSMC
    color: "🟢"
    note: "Quiet chip enabler"
    narrative_fit: strong
  CBRS:
    name: Cerebras
    color: "🟢"
    note: "Pure specialized inference play (volatile)"
    narrative_fit: strong
  CRDO:
    name: Credo
    color: "🟡"
    note: "Viral AI connectivity play"
    narrative_fit: monitor
  MU:
    name: Micron
    color: "🟡"
    note: "HBM memory - inference critical"
    narrative_fit: monitor

export:
  directory: exports

alerts:
  email: false
  telegram: false

telegram:
  enabled: false
  bot_token: ""  # Create bot via BotFather, get token
  chat_id: ""   # Your chat ID or channel @username

dashboard:
  enabled: true
  port: 8501
  refresh_interval: 60  # seconds for auto-refresh (0 to disable)

twitter:
  enabled: true
  bearer_token: ""  # Set your X API v2 bearer token here or in .env
  search_limit: 50
  lookback_hours: 24

sentiment:
  model: "ProsusAI/finbert"
  enabled: true
  fallback_to_vader: true
