services:
  stock-intel:
    build: .
    container_name: stock-intelligence-engine
    command: ["--news", "--export"]
    volumes:
      - ./exports:/app/exports
      - ./config.yaml:/app/config.yaml:ro
    restart: "no"

  dashboard:
    build: .
    container_name: stock-intelligence-dashboard
    entrypoint: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - ./exports:/app/exports
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
