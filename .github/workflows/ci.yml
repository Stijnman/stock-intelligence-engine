name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install flake8

      - name: Check for fatal lint errors
        run: python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run test suite
        run: python -m pytest -q

      - name: Run repository hygiene check
        run: python scripts/check_repo.py

      - name: Verify CLI entry point
        run: python stock_intelligence_engine.py --help
