## ⚠️ Security Considerations

**⚠️ IMPORTANT**: Please do NOT include any of the following in this issue:
- Real API keys or credentials
- Real email addresses or personal data
- Production account details
- Sensitive configuration
- Financial data or positions

All sensitive information should be **REDACTED** or replaced with placeholders like `[REDACTED]`, `api_key_***`, etc.

